name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # RVars.jl is unregistered, so `Pkg.test()` cannot resolve it. Instead we
      # develop RVars (by URL) and the package under test (by path) into the test
      # environment, then run the suite directly against that environment.
      - name: Set up test environment (develop unregistered RVars)
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop([
                PackageSpec(path="."),
                PackageSpec(url="https://github.com/karimn/RVars.jl"),
            ])
            Pkg.instantiate()'
      - name: Run tests
        run: julia --project=test test/runtests.jl
