name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # RVars.jl is unregistered, so `Pkg.test()` cannot resolve it. Add RVars by
      # its GitHub URL and develop the package under test into the test environment,
      # then run the suite directly against that environment.
      - name: Set up test environment (add unregistered RVars by URL)
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.add(url="https://github.com/karimn/RVars.jl")
            Pkg.develop(path=".")
            Pkg.instantiate()'
      - name: Run tests
        run: julia --project=test test/runtests.jl

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Project.toml version was bumped
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          base_version=$(git show "origin/${{ github.base_ref }}:Project.toml" | grep -m1 '^version' | cut -d '"' -f2)
          pr_version=$(grep -m1 '^version' Project.toml | cut -d '"' -f2)
          echo "Base branch version: $base_version"
          echo "This PR's version:   $pr_version"
          if [ "$base_version" = "$pr_version" ]; then
            echo "::error file=Project.toml::Version was not bumped (still $pr_version). Every PR must bump the version in Project.toml."
            exit 1
          fi
